name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm # keyed by the lockfile hash
      - run: npm ci

      - name: Types
        run: npm run typecheck
      - name: Budget — fewer than five `as`, no `any`
        run: npm run check:casts
      - name: Lint (type-checked rules, no-floating-promises)
        run: npm run lint
      - name: Unit and property tests, with coverage (shared/ must stay ≥ 85 %)
        run: npm test && npm run coverage
      - name: Build
        run: npm run build

      - name: Browsers for the end-to-end test
        run: npx playwright install --with-deps chromium
      - name: End to end — two real browsers in one room
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            docs/lab-07/e2e-*.png
